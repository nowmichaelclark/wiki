# Builds the website and the Listen audio on every push to main, and once a day
# to catch up on audio a busy day left unfinished. See _tools/build.py.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"   # 03:17 in Thailand

permissions:
  contents: write   # the audio files are release assets
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # page dates come from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _tools/requirements.txt

      - name: Install tools
        run: |
          pip install -r _tools/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Check pages
        run: python _tools/check.py --github

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: paradee-1.2

      - name: Make Listen audio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python _tools/audio.py --manifest-out audio.json --max 150 --minutes 240

      - name: Build site
        run: python _tools/build.py --out _site --audio audio.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
